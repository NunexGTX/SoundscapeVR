@startuml
enum VisualType {
    STATIC= 1,
    ENCOMPASSING= 2,
    BOTH= -1,
    NONE= 0,
}
enum AudioSourceType {
    BINAURAL,
    ENCOMPASSING,
    NONE,
}
enum AudioListeningType {
    BINAURAL= 1,
    ENCOMPASSING= 2,
    NONE= 0,
}
@enduml

