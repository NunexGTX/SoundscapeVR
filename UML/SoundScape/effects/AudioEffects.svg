@startuml
class AudioEffects {
    + {static} GetAudioEffectData(effectId:string) : AudioEffectData
    + {static} GetEffects() : List<AudioEffectData>
}
AudioEffects o-> "ECHO_EFFECT" AudioEffectData
AudioEffects o-> "OCCLUSION_EFFECT" AudioEffectData
AudioEffects o-> "PASS_EFFECT" AudioEffectData
AudioEffects o-> "REVERB_EFFECT" AudioEffectData
@enduml

