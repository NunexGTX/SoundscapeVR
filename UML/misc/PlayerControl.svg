link PlayerControl to Transform--><path d="M135,318.07 C135,337.98 135,357.35 135,372.36 " fill="none" id="PlayerControl-&gt;Transform" style="stroke: #A80036; stroke-width: 1.0;"/><polygon fill="#A80036" points="135,377.68,139,368.68,135,372.68,131,368.68,135,377.68" style="stroke: #A80036; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="114" x="7.1063" y="367.007">cameraTransform</text><!--MD5=[634d571f6809a61cf05faea60274a2d7]
@startuml
class PlayerControl {
    + walkSpeed : float = 5f
    + gravity : float
    + jumpHeight : float = 1.5f
    + mouseSensitivity : float = 2f
    + upperLookLimit : float = 80f
    + lowerLookLimit : float
    + IsDisabled() : bool
    + SetPlayerRotation(canRotate:bool) : void
    + SetPlayerMovement(canMove:bool) : void
    + OnMove(value:InputValue) : void
    + OnLook(value:InputValue) : void
    + OnJump(value:InputValue) : void
}
MonoBehaviour <|- - PlayerControl
PlayerControl - -> "cameraTransform" Transform
@enduml

