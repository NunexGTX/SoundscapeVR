@startuml
class PlayerUIScrollHandler {
    + scrollSpeed : float = 600f
    + threshold : float = 0.1f
    + invertVertical : bool = false
}
MonoBehaviour <|- - PlayerUIScrollHandler
PlayerUIScrollHandler - -> "rightInteractor" NearFarInteractor
PlayerUIScrollHandler - -> "rightScrollAction" InputActionReference
@enduml

