name: Generate UML
on:
  push:
    branches:
      - uml-main-test
  workflow_dispatch:
jobs:
  generate-uml:
    name: 'Generate UML'
    runs-on: ubuntu-latest
    env:
      CODE_PATH: "./Assets/SoundscapeFiles/Scripts/"
      UML_OUTPUT_PATH: "./UML/"
      UMP_GENERATION_PARAMETERS: -public -createAssociation -allInOne
    steps:
      - uses: actions/checkout@v2

      - name: Remove old diagrams
        run: rm -r ${{ env.UML_OUTPUT_PATH }} || true

      - name: Check if there is code
        id: check_for_code
        run: |
          if [ -d ${{ env.CODE_PATH }} ]; then
            echo "CODE_EXISTS=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-dotnet@v1
        if: ${{ steps.check_for_code.outputs.CODE_EXISTS == 'true' }}
        with:
          dotnet-version: 5.0.x

      - if: ${{ steps.check_for_code.outputs.CODE_EXISTS == 'true' }}
        run: dotnet tool install --global PlantUmlClassDiagramGenerator --version 1.2.4
      - if: ${{ steps.check_for_code.outputs.CODE_EXISTS == 'true' }}
        run: dotnet tool restore

      - name: Create a folder for diagrams
        if: ${{ steps.check_for_code.outputs.CODE_EXISTS == 'true' }}
        run: mkdir -p ${{ env.UML_OUTPUT_PATH }}

      - name: Generate PlantUML files
        if: ${{ steps.check_for_code.outputs.CODE_EXISTS == 'true' }}
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          puml-gen ${{ env.CODE_PATH }} ${{ env.UML_OUTPUT_PATH }} -dir ${{ env.UMP_GENERATION_PARAMETERS }}

      - name: Get File names
        if: ${{ steps.check_for_code.outputs.CODE_EXISTS == 'true' }}
        id: get_file_names
        run: |
          echo "UML_FILES=$(find ${{ env.UML_OUTPUT_PATH }} -name "*.puml" | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - name: Install PlantUML
        if: ${{ steps.check_for_code.outputs.CODE_EXISTS == 'true' }}
        run: sudo apt-get update && sudo apt-get install -y plantuml graphviz

      - name: Generate SVG Diagrams
        if: ${{ steps.check_for_code.outputs.CODE_EXISTS == 'true' }}
        run: plantuml -v -tsvg ${{ steps.get_file_names.outputs.UML_FILES }}

      - uses: EndBug/add-and-commit@v7.0.0
        with:
          author_name: 'UML Bot'
          message: 'Generate UML (${{ github.workflow }})'
          author_email: 41898282+uml-bot[bot]@users.noreply.github.com
